# Create the Slack app from this manifest: api.slack.com/apps -> Create New App -> From a manifest.
# See docs/SETUP_SLACK.md for every step.
display_information:
  name: MonetizeIQ
  description: Pricing recommendations for AI agents. Price the work, not the seat.
  background_color: "#3B1C8C"
features:
  bot_user:
    display_name: MonetizeIQ
    always_online: true
  slash_commands:
    - command: /monetize
      description: Pricing recommendation for an account, or outcome readiness by AI category
      usage_hint: "<account name> | ready | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
